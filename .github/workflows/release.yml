name: release

# Publishes the Swift CLI built with the Xcode toolchain alone. This fork does not
# publish the Go build or a Homebrew bottle: those belong to upstream
# (github.com/mobai-app/simslim) and its tap.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  SIMSLIM_RELEASE_TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          cd swift
          swift test
      - name: Build
        run: |
          SIMSLIM_VERSION="${SIMSLIM_RELEASE_TAG#v}"
          printf '// Copyright (c) 2026 Pavel Akhrameev (Swift port). MIT License; see LICENSE.\n\npublic let simslimVersion = "%s"\n' \
            "${SIMSLIM_VERSION}" > swift/Sources/SimSlimKit/Version.swift
          (cd swift && swift build -c release)
          cp swift/.build/release/simslim simslim
          codesign --force --sign - simslim
          test "$(./simslim --version)" = "simslim ${SIMSLIM_VERSION}"
          tar -czf "simslim-${SIMSLIM_RELEASE_TAG}-macos-arm64.tar.gz" simslim
          shasum -a 256 "simslim-${SIMSLIM_RELEASE_TAG}-macos-arm64.tar.gz" | tee "simslim-${SIMSLIM_RELEASE_TAG}-macos-arm64.tar.gz.sha256"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SIMSLIM_RELEASE_TAG }}
          generate_release_notes: true
          files: |
            simslim-*-macos-arm64.tar.gz
            simslim-*.sha256
